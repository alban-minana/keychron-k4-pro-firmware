changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Bug fixes
      labels: [bug]
    - title: Latency & responsiveness
      labels: [latency]
    - title: Battery life
      labels: [battery]
    - title: New features & improvements
      labels: [enhancement]
    - title: Other changes
      labels: ["*"]
