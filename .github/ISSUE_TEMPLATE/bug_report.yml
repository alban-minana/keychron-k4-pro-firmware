name: Bug report
description: Something does not work as expected with this firmware
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Please check the [open issues](../issues) first.
  - type: dropdown
    id: variant
    attributes:
      label: Keyboard variant
      options: [ISO RGB, ISO White, ANSI RGB, ANSI White]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: The release you flashed (e.g. v0.1.0-beta)
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection mode
      multiple: true
      options: [USB cable, Bluetooth]
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host OS / device
      placeholder: Windows 11, macOS 15, iPadOS…
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Switch to Bluetooth\n2. Leave the keyboard idle 5 min\n3. …"
  - type: dropdown
    id: stock
    attributes:
      label: Does it also happen with the stock Keychron firmware?
      options: [I don't know, "Yes", "No"]
