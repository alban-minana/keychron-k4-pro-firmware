name: Improvement idea
description: Suggest a feature or an improvement (latency, battery, behaviour…)
labels: [enhancement, triage]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / in which situation would it help?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Latency / responsiveness, Battery life, Bluetooth, Lighting, Keymap / features, Other]
