<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#151b2c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient></defs><rect width="1280" height="300" rx="18" fill="url(#bg)"/><g transform="translate(40,36)"><rect width="284" height="228" rx="16" fill="#121829" stroke="#263049"/><circle cx="46" cy="50" r="22" fill="#22d3ee"/><text x="46" y="58" font-size="22" font-weight="800" fill="#0b0f19" text-anchor="middle">1</text><text x="24" y="114" font-size="21" font-weight="800" fill="#e6edf3">Switch to Cable</text><text x="24" y="148" font-size="15" fill="#8b98b0">Flip the switch on the back to</text><text x="24" y="170" font-size="15" fill="#8b98b0">Cable, then unplug the</text><text x="24" y="192" font-size="15" fill="#8b98b0">keyboard.</text></g><path d="M328,150 l14,0 m-6,-6 l6,6 l-6,6" stroke="#8b98b0" stroke-width="2.5" fill="none" stroke-linecap="round"/><g transform="translate(348,36)"><rect width="284" height="228" rx="16" fill="#121829" stroke="#263049"/><circle cx="46" cy="50" r="22" fill="#a78bfa"/><text x="46" y="58" font-size="22" font-weight="800" fill="#0b0f19" text-anchor="middle">2</text><text x="24" y="114" font-size="21" font-weight="800" fill="#e6edf3">Hold Esc + plug in</text><text x="24" y="148" font-size="15" fill="#8b98b0">Keep Esc pressed while</text><text x="24" y="170" font-size="15" fill="#8b98b0">plugging the cable back in.</text><text x="24" y="192" font-size="15" fill="#8b98b0">The keyboard stays dark.</text></g><path d="M636,150 l14,0 m-6,-6 l6,6 l-6,6" stroke="#8b98b0" stroke-width="2.5" fill="none" stroke-linecap="round"/><g transform="translate(656,36)"><rect width="284" height="228" rx="16" fill="#121829" stroke="#263049"/><circle cx="46" cy="50" r="22" fill="#f472b6"/><text x="46" y="58" font-size="22" font-weight="800" fill="#0b0f19" text-anchor="middle">3</text><text x="24" y="114" font-size="21" font-weight="800" fill="#e6edf3">Flash</text><text x="24" y="148" font-size="15" fill="#8b98b0">QMK Toolbox shows “STM32 DFU</text><text x="24" y="170" font-size="15" fill="#8b98b0">device connected”. Open the</text><text x="24" y="192" font-size="15" fill="#8b98b0">.bin, click Flash.</text></g><path d="M944,150 l14,0 m-6,-6 l6,6 l-6,6" stroke="#8b98b0" stroke-width="2.5" fill="none" stroke-linecap="round"/><g transform="translate(964,36)"><rect width="284" height="228" rx="16" fill="#121829" stroke="#263049"/><circle cx="46" cy="50" r="22" fill="#34d399"/><text x="46" y="58" font-size="22" font-weight="800" fill="#0b0f19" text-anchor="middle">4</text><text x="24" y="114" font-size="21" font-weight="800" fill="#e6edf3">Reset</text><text x="24" y="148" font-size="15" fill="#8b98b0">Hold Fn + J + Z for 3 s. Done</text><text x="24" y="170" font-size="15" fill="#8b98b0">— re-pair Bluetooth if needed.</text></g></svg>
