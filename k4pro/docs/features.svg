<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#151b2c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient></defs><rect width="1280" height="360" rx="18" fill="url(#bg)"/><g transform="translate(40,32)"><rect width="384" height="296" rx="16" fill="#121829" stroke="#263049"/><rect x="24" y="0" width="336" height="3" rx="1.5" fill="#22d3ee"/><g transform="translate(28,30)"><path d="M26 4 L10 30 H22 L18 52 L38 22 H26 Z" fill="#22d3ee"/></g><text x="98" y="68" font-size="24" font-weight="800" fill="#e6edf3">Responsiveness</text><circle cx="34" cy="123" r="4" fill="#22d3ee"/><text x="50" y="128" font-size="15.5" fill="#e6edf3">Eager debounce: press sent on first contact</text><circle cx="34" cy="165" r="4" fill="#22d3ee"/><text x="50" y="170" font-size="15.5" fill="#e6edf3">No 3 ms Bluetooth wake stall per report</text><circle cx="34" cy="207" r="4" fill="#22d3ee"/><text x="50" y="212" font-size="15.5" fill="#e6edf3">Bluetooth at 133 Hz instead of 90 Hz</text><circle cx="34" cy="249" r="4" fill="#22d3ee"/><text x="50" y="254" font-size="15.5" fill="#e6edf3">Matrix scanned ~2× faster</text></g><g transform="translate(448,32)"><rect width="384" height="296" rx="16" fill="#121829" stroke="#263049"/><rect x="24" y="0" width="336" height="3" rx="1.5" fill="#f472b6"/><g transform="translate(28,30)"><path d="M28 4 L48 12 V28 C48 41 39 50 28 54 C17 50 8 41 8 28 V12 Z" fill="none" stroke="#f472b6" stroke-width="4" stroke-linejoin="round"/><path d="M18 29 L25 36 L39 21" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="98" y="68" font-size="24" font-weight="800" fill="#e6edf3">Reliability</text><circle cx="34" cy="123" r="4" fill="#f472b6"/><text x="50" y="128" font-size="15.5" fill="#e6edf3">Fixes stuck / repeating keys over Bluetooth</text><circle cx="34" cy="165" r="4" fill="#f472b6"/><text x="50" y="170" font-size="15.5" fill="#e6edf3">Fixes media keys that kept repeating</text><circle cx="34" cy="207" r="4" fill="#f472b6"/><text x="50" y="212" font-size="15.5" fill="#e6edf3">Pairing no longer runs code in an interrupt</text><circle cx="34" cy="249" r="4" fill="#f472b6"/><text x="50" y="254" font-size="15.5" fill="#e6edf3">Hardened Bluetooth packet parsing</text></g><g transform="translate(856,32)"><rect width="384" height="296" rx="16" fill="#121829" stroke="#263049"/><rect x="24" y="0" width="336" height="3" rx="1.5" fill="#34d399"/><g transform="translate(28,30)"><rect x="6" y="16" width="40" height="24" rx="5" fill="none" stroke="#34d399" stroke-width="4"/><rect x="47" y="23" width="5" height="10" rx="2" fill="#34d399"/><rect x="12" y="22" width="22" height="12" rx="2" fill="#34d399"/></g><text x="98" y="68" font-size="24" font-weight="800" fill="#e6edf3">Battery life</text><circle cx="34" cy="123" r="4" fill="#34d399"/><text x="50" y="128" font-size="15.5" fill="#e6edf3">Backlight off after 3 min idle (was 10)</text><circle cx="34" cy="165" r="4" fill="#34d399"/><text x="50" y="170" font-size="15.5" fill="#e6edf3">MCU sleeps sooner and works less</text><circle cx="34" cy="207" r="4" fill="#34d399"/><text x="50" y="212" font-size="15.5" fill="#e6edf3">Battery level shown on your computer</text><circle cx="34" cy="249" r="4" fill="#34d399"/><text x="50" y="254" font-size="15.5" fill="#e6edf3">Accurate Li-ion percentage curve</text></g></svg>
