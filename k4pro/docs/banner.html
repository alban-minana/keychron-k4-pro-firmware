<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mori;src:local("PP Mori"), local("PPMori-Regular")}
html,body{margin:0;background:transparent}
.b{width:2560px;height:720px;border-radius:32px;overflow:hidden;position:relative;background:#0a0a0a;
 box-shadow:inset 0 0 0 2px #1c1c1f}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1.5px,transparent 1.5px),linear-gradient(90deg,#ffffff0a 1.5px,transparent 1.5px);
 background-size:80px 80px;background-position:-2px -2px;
 -webkit-mask-image:radial-gradient(ellipse 70% 90% at 50% 60%,#000 30%,transparent 80%)}
.glow{position:absolute;left:50%;bottom:-420px;width:1900px;height:760px;transform:translateX(-50%);
 background:radial-gradient(ellipse at center,#0b1d8acc 0%,#0a1a6a66 35%,transparent 70%)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Mori,sans-serif}
h1{margin:0;font-size:150px;font-weight:400;letter-spacing:-4px;line-height:1;
 background:linear-gradient(180deg,#ffffff 30%,#dfe3ff);-webkit-background-clip:text;color:transparent}
p{margin:44px 0 0;font-size:46px;color:#8a8a93;letter-spacing:-.5px}
</style></head><body><div class="b"><div class="grid"></div><div class="glow"></div>
<div class="c"><h1>Keychron K4 Pro</h1><p>Community firmware. Faster, fixed, longer battery life.</p></div></div></body></html>
