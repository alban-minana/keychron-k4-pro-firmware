<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#151b2c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b98b0"/></marker></defs><rect width="1280" height="470" rx="18" fill="url(#bg)"/><text x="48" y="64" font-size="28" font-weight="800" fill="#e6edf3">Inside the K4 Pro</text><text x="48" y="94" font-size="15" fill="#8b98b0">What this firmware runs on, and what it controls.</text><g transform="translate(48,140)"><rect width="280" height="100" rx="14" fill="#121829" stroke="#263049" stroke-width="1.2"/><text x="140.0" y="44.0" font-size="18" font-weight="800" fill="#e6edf3" text-anchor="middle">Key matrix</text><text x="140.0" y="68.0" font-size="13.5" fill="#8b98b0" text-anchor="middle">6 × 18 · 74HC595 shift register</text></g><g transform="translate(48,300)"><rect width="280" height="100" rx="14" fill="#121829" stroke="#263049" stroke-width="1.2"/><text x="140.0" y="44.0" font-size="18" font-weight="800" fill="#e6edf3" text-anchor="middle">2 × CKLED2001</text><text x="140.0" y="68.0" font-size="13.5" fill="#8b98b0" text-anchor="middle">LED drivers over I²C</text></g><g transform="translate(480,140)"><rect width="320" height="260" rx="14" fill="#16223b" stroke="#22d3ee" stroke-width="2"/><text x="160.0" y="124.0" font-size="18" font-weight="800" fill="#e6edf3" text-anchor="middle"></text><text x="160.0" y="148.0" font-size="13.5" fill="#8b98b0" text-anchor="middle"></text></g><g transform="translate(952,140)"><rect width="280" height="100" rx="14" fill="#121829" stroke="#263049" stroke-width="1.2"/><text x="140.0" y="44.0" font-size="18" font-weight="800" fill="#e6edf3" text-anchor="middle">USB-C</text><text x="140.0" y="68.0" font-size="13.5" fill="#8b98b0" text-anchor="middle">Full-speed USB · 1000 Hz</text></g><g transform="translate(952,300)"><rect width="280" height="100" rx="14" fill="#121829" stroke="#fbbf24" stroke-width="1.2"/><text x="140.0" y="44.0" font-size="18" font-weight="800" fill="#e6edf3" text-anchor="middle">CKBT51</text><text x="140.0" y="68.0" font-size="13.5" fill="#8b98b0" text-anchor="middle">Bluetooth Classic · closed firmware</text></g><text x="640" y="196" font-size="22" font-weight="800" fill="#e6edf3" text-anchor="middle">STM32L432</text><text x="640" y="222" font-size="14" fill="#8b98b0" text-anchor="middle">Cortex-M4 · 48 MHz · 256 KB flash</text><rect x="530" y="250" width="220" height="40" rx="20" fill="url(#accent)"/><text x="640" y="276" font-size="15" font-weight="800" fill="#0b0f19" text-anchor="middle">this firmware runs here</text><text x="640" y="330" font-size="13.5" fill="#8b98b0" text-anchor="middle">QMK + Keychron Bluetooth stack</text><text x="640" y="352" font-size="13.5" fill="#8b98b0" text-anchor="middle">sleeps in STOP mode when idle</text><path d="M328,190 L478,190" stroke="#8b98b0" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="403.0" y="178" font-size="13" fill="#8b98b0" text-anchor="middle">scan</text><path d="M478,350 L330,350" stroke="#8b98b0" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="404.0" y="338" font-size="13" fill="#8b98b0" text-anchor="middle">I²C</text><path d="M800,190 L950,190" stroke="#8b98b0" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="875.0" y="178" font-size="13" fill="#8b98b0" text-anchor="middle">USB</text><path d="M800,350 L950,350" stroke="#8b98b0" stroke-width="2" fill="none" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="875.0" y="338" font-size="13" fill="#8b98b0" text-anchor="middle">UART 460 kbaud</text><text x="48" y="442" font-size="13.5" fill="#8b98b0">The Bluetooth module runs its own closed firmware: radio range and stability can only be tuned through its settings.</text></svg>
