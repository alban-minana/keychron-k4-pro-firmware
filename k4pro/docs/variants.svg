<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0f19"/><stop offset="1" stop-color="#151b2c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
  </linearGradient></defs><rect width="1280" height="330" rx="18" fill="url(#bg)"/><text x="48" y="58" font-size="26" font-weight="800" fill="#e6edf3">Which file do I need?</text><text x="48" y="86" font-size="15" fill="#8b98b0">Look at the Enter key, then at the backlight colour.</text><g transform="translate(48,112)"><rect width="380" height="186" rx="16" fill="#121829" stroke="#263049"/><text x="24" y="44" font-size="24" font-weight="800" fill="#22d3ee">ISO</text><text x="24" y="70" font-size="13.5" fill="#8b98b0">Tall Enter · extra key by left Shift</text><path d="M262,86 h69.0 v92 h-57.5 v-46 h-11.5 Z" fill="#232a40" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/><text x="305.7" y="114.52" font-size="14" fill="#e6edf3" text-anchor="middle">Enter</text><text x="24" y="118" font-size="13" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', Consolas, monospace">…_iso_rgb_…bin</text><text x="24" y="142" font-size="13" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', Consolas, monospace">…_iso_white_…bin</text></g><g transform="translate(452,112)"><rect width="380" height="186" rx="16" fill="#121829" stroke="#263049"/><text x="24" y="44" font-size="24" font-weight="800" fill="#a78bfa">ANSI</text><text x="24" y="70" font-size="13.5" fill="#8b98b0">Wide, single-row Enter key</text><rect x="262" y="109.0" width="103.5" height="46" rx="6" fill="#232a40" stroke="#a78bfa" stroke-width="2.5"/><text x="313.52" y="136.6" font-size="14" fill="#e6edf3" text-anchor="middle">Enter</text><text x="24" y="118" font-size="13" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', Consolas, monospace">…_ansi_rgb_…bin</text><text x="24" y="142" font-size="13" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', Consolas, monospace">…_ansi_white_…bin</text></g><g transform="translate(856,112)"><rect width="376" height="186" rx="16" fill="#121829" stroke="#263049"/><text x="24" y="44" font-size="24" font-weight="800" fill="#e6edf3">Backlight</text><rect x="24" y="72" width="150" height="40" rx="10" fill="url(#accent)"/><text x="99" y="98" font-size="15" font-weight="800" fill="#0b0f19" text-anchor="middle">RGB → _rgb_</text><rect x="196" y="72" width="156" height="40" rx="10" fill="#e9edf5"/><text x="274" y="98" font-size="15" font-weight="800" fill="#0b0f19" text-anchor="middle">White → _white_</text><text x="24" y="150" font-size="13.5" fill="#8b98b0">Wrong file? No permanent harm: flash</text><text x="24" y="170" font-size="13.5" fill="#8b98b0">the right one the same way.</text></g></svg>
